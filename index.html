<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SymboTalk AI - Bridging spoken language and visual actions for inclusive communication">
    <title>SymboTalk AI - Universal Communication Bridge</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="assets/icon-192.png">
    <meta name="theme-color" content="#6366f1">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">🤖</div>
                    <h1>SymboTalk AI</h1>
                </div>
                <p class="tagline">Universal Communication Bridge</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Mode Selection -->
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="speech-to-action">
                    <span class="mode-icon">🗣️➡️🙆</span>
                    <span class="mode-title">Speech to Action</span>
                    <span class="mode-desc">Convert speech to visual actions</span>
                </button>
                <button class="mode-btn" data-mode="action-to-speech">
                    <span class="mode-icon">🙆➡️🔊</span>
                    <span class="mode-title">Action to Speech</span>
                    <span class="mode-desc">Convert gestures to spoken words</span>
                </button>
            </div>

            <!-- Speech to Action Mode -->
            <div class="mode-content active" id="speech-to-action">
                <div class="communication-area">
                    <div class="input-section">
                        <div class="speech-input">
                            <button class="mic-btn" id="speechBtn">
                                <span class="mic-icon">🎤</span>
                                <span class="mic-text">Tap to Speak</span>
                            </button>
                            <div class="speech-status" id="speechStatus"></div>
                        </div>
                        <div class="text-display" id="textDisplay"></div>
                    </div>
                    
                    <div class="avatar-section">
                        <div class="avatar-container">
                            <div class="avatar" id="avatar">
                                <div class="avatar-face">😊</div>
                                <div class="avatar-body"></div>
                            </div>
                        </div>
                        <div class="action-description" id="actionDescription">
                            Ready to translate your speech into actions
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action to Speech Mode -->
            <div class="mode-content" id="action-to-speech">
                <div class="communication-area">
                    <div class="camera-section">
                        <video id="camera" autoplay muted playsinline></video>
                        <canvas id="gestureCanvas" style="display: none;"></canvas>
                        <div class="camera-overlay">
                            <div class="gesture-guide">
                                <span class="gesture-icon">👋</span>
                                <p>Perform gestures in front of the camera</p>
                            </div>
                        </div>
                        <button class="camera-btn" id="cameraBtn">
                            <span class="camera-icon">📷</span>
                            <span>Start Camera</span>
                        </button>
                    </div>
                    
                    <div class="output-section">
                        <div class="speech-output" id="speechOutput">
                            <div class="output-text" id="outputText">
                                Gesture recognition ready
                            </div>
                            <button class="speak-btn" id="speakBtn" disabled>
                                <span class="speak-icon">🔊</span>
                                <span>Speak</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Settings Panel -->
        <div class="settings-panel" id="settingsPanel">
            <div class="settings-header">
                <h3>Settings</h3>
                <button class="close-btn" id="closeSettings">×</button>
            </div>
            <div class="settings-content">
                <div class="setting-group">
                    <label for="voiceSelect">Voice:</label>
                    <select id="voiceSelect"></select>
                </div>
                <div class="setting-group">
                    <label for="speedSelect">Speech Speed:</label>
                    <select id="speedSelect">
                        <option value="0.5">Slow</option>
                        <option value="1" selected>Normal</option>
                        <option value="1.5">Fast</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label for="languageSelect">Language:</label>
                    <select id="languageSelect">
                        <option value="en-US" selected>English (US)</option>
                        <option value="es-ES">Spanish</option>
                        <option value="fr-FR">French</option>
                        <option value="de-DE">German</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Floating Action Button -->
        <button class="fab" id="settingsBtn">
            <span class="fab-icon">⚙️</span>
        </button>

        <!-- Status Bar -->
        <div class="status-bar" id="statusBar">
            <span class="status-text" id="statusText">Ready</span>
            <span class="connection-status" id="connectionStatus">🟢 Online</span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script src="js/speech.js"></script>
    <script src="js/gesture.js"></script>
    <script src="js/avatar.js"></script>
    <script src="js/sw-register.js"></script>
</body>
</html>
