<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Analysis - SymboTalk AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }
        
        .upload-section {
            background: #f8f9fa;
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }
        
        .upload-section:hover {
            border-color: #764ba2;
            background: #f0f0ff;
        }
        
        .upload-section.dragover {
            background: #e8e8ff;
            border-color: #764ba2;
        }
        
        .file-input-wrapper {
            position: relative;
            display: inline-block;
            cursor: pointer;
        }
        
        .file-input {
            position: absolute;
            left: -9999px;
        }
        
        .file-input-label {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            display: inline-block;
        }
        
        .file-input-label:hover {
            transform: scale(1.05);
        }
        
        .file-info {
            margin-top: 20px;
            color: #333;
            font-size: 1em;
        }
        
        .analyze-btn {
            background: #28a745;
            color: white;
            padding: 15px 50px;
            border: none;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }
        
        .analyze-btn:hover:not(:disabled) {
            background: #218838;
            transform: scale(1.05);
        }
        
        .analyze-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .results-section {
            display: none;
            margin-top: 40px;
        }
        
        .results-section.active {
            display: block;
        }
        
        .metric-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .metric-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .metric-value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .metric-label {
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        .clause-section {
            margin-bottom: 30px;
        }
        
        .clause-type-header {
            background: #667eea;
            color: white;
            padding: 15px 25px;
            border-radius: 10px 10px 0 0;
            font-size: 1.3em;
            font-weight: bold;
        }
        
        .clause-item {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-top: none;
            padding: 20px;
            margin-bottom: 1px;
        }
        
        .clause-item:last-child {
            border-radius: 0 0 10px 10px;
        }
        
        .clause-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .clause-meta {
            color: #666;
            font-size: 0.9em;
        }
        
        .confidence {
            background: #28a745;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }
        
        .confidence.medium {
            background: #ffc107;
        }
        
        .confidence.low {
            background: #dc3545;
        }
        
        .deviation-badge {
            background: #dc3545;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            display: inline-block;
            margin-left: 10px;
        }
        
        .clause-text {
            color: #333;
            line-height: 1.6;
            margin: 15px 0;
        }
        
        .obligations {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }
        
        .obligation-item {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        
        .obligation-item:last-child {
            border-bottom: none;
        }
        
        .summary-section {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .summary-title {
            color: #856404;
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .risk-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 5px solid #dc3545;
        }
        
        .risk-item.medium {
            border-left-color: #ffc107;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: #e9ecef;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 Contract Analysis</h1>
        <p class="subtitle">AI-Powered Legal Document Analysis with 90%+ Accuracy</p>
        
        <div class="upload-section" id="uploadSection">
            <h2>Upload Contract Document</h2>
            <p style="margin: 20px 0; color: #666;">Supports PDF, DOCX, and TXT files up to 80 pages</p>
            
            <div class="file-input-wrapper">
                <input type="file" id="fileInput" class="file-input" accept=".pdf,.docx,.txt">
                <label for="fileInput" class="file-input-label">Choose File</label>
            </div>
            
            <div class="file-info" id="fileInfo">No file selected</div>
            
            <button class="analyze-btn" id="analyzeBtn" disabled>Analyze Contract</button>
        </div>
        
        <div class="loading" id="loadingSection">
            <div class="spinner"></div>
            <p>Analyzing contract... This may take a moment.</p>
        </div>
        
        <div class="results-section" id="resultsSection">
            <h2 style="margin-bottom: 20px;">Analysis Results</h2>
            
            <div class="metric-cards" id="metricCards"></div>
            
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="showTab('summary')">Summary</button>
                <button class="tab-btn" onclick="showTab('clauses')">Extracted Clauses</button>
                <button class="tab-btn" onclick="showTab('risks')">Risk Areas</button>
            </div>
            
            <div class="tab-content active" id="summaryTab"></div>
            <div class="tab-content" id="clausesTab"></div>
            <div class="tab-content" id="risksTab"></div>
        </div>
    </div>
    
    <script>
        let selectedFile = null;
        
        // File selection
        document.getElementById('fileInput').addEventListener('change', function(e) {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                document.getElementById('fileInfo').textContent = 
                    `Selected: ${selectedFile.name} (${(selectedFile.size / 1024 / 1024).toFixed(2)} MB)`;
                document.getElementById('analyzeBtn').disabled = false;
            }
        });
        
        // Drag and drop
        const uploadSection = document.getElementById('uploadSection');
        
        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.classList.add('dragover');
        });
        
        uploadSection.addEventListener('dragleave', () => {
            uploadSection.classList.remove('dragover');
        });
        
        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                selectedFile = files[0];
                document.getElementById('fileInfo').textContent = 
                    `Selected: ${selectedFile.name} (${(selectedFile.size / 1024 / 1024).toFixed(2)} MB)`;
                document.getElementById('analyzeBtn').disabled = false;
            }
        });
        
        // Analyze button
        document.getElementById('analyzeBtn').addEventListener('click', analyzeContract);
        
        async function analyzeContract() {
            if (!selectedFile) return;
            
            // Show loading
            document.getElementById('loadingSection').classList.add('active');
            document.getElementById('resultsSection').classList.remove('active');
            
            // Create form data
            const formData = new FormData();
            formData.append('file', selectedFile);
            
            try {
                // Call API (localhost for testing)
                const response = await fetch('http://localhost:5000/api/analyze', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                displayResults(data);
                
            } catch (error) {
                console.error('Error:', error);
                alert('Analysis failed. Make sure the API server is running on port 5000.\n\nError: ' + error.message);
            } finally {
                document.getElementById('loadingSection').classList.remove('active');
            }
        }
        
        function displayResults(data) {
            // Show results section
            document.getElementById('resultsSection').classList.add('active');
            
            // Display metrics
            const metricCards = document.getElementById('metricCards');
            metricCards.innerHTML = `
                <div class="metric-card">
                    <div class="metric-value">${data.clauses.length}</div>
                    <div class="metric-label">Total Clauses</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value">${data.metrics.deviations_found}</div>
                    <div class="metric-label">Deviations Found</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value">${data.metadata.total_pages}</div>
                    <div class="metric-label">Pages Analyzed</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value">${(data.metrics.average_confidence * 100).toFixed(0)}%</div>
                    <div class="metric-label">Avg Confidence</div>
                </div>
            `;
            
            // Display summary
            displaySummary(data.summary);
            
            // Display clauses
            displayClauses(data.clauses);
            
            // Display risks
            displayRisks(data.summary.risk_areas);
        }
        
        function displaySummary(summary) {
            const summaryTab = document.getElementById('summaryTab');
            summaryTab.innerHTML = `
                <div class="summary-section">
                    <div class="summary-title">📊 Overview</div>
                    <p><strong>Total Clauses:</strong> ${summary.overview.total_clauses}</p>
                    <p><strong>Termination Clauses:</strong> ${summary.overview.clause_breakdown.termination || 0}</p>
                    <p><strong>Indemnity Clauses:</strong> ${summary.overview.clause_breakdown.indemnity || 0}</p>
                    <p><strong>SLA Clauses:</strong> ${summary.overview.clause_breakdown.sla || 0}</p>
                    <p><strong>Deviations Found:</strong> ${summary.overview.deviations_found}</p>
                </div>
                
                <div class="summary-section">
                    <div class="summary-title">📋 Action Items</div>
                    ${summary.action_items.slice(0, 5).map(item => `
                        <div style="padding: 10px 0; border-bottom: 1px solid #ddd;">${item}</div>
                    `).join('')}
                </div>
            `;
        }
        
        function displayClauses(clauses) {
            const clausesTab = document.getElementById('clausesTab');
            
            const groupedClauses = {
                termination: [],
                indemnity: [],
                sla: []
            };
            
            clauses.forEach(clause => {
                if (groupedClauses[clause.clause_type]) {
                    groupedClauses[clause.clause_type].push(clause);
                }
            });
            
            let html = '';
            for (const [type, typeClauses] of Object.entries(groupedClauses)) {
                if (typeClauses.length > 0) {
                    html += `
                        <div class="clause-section">
                            <div class="clause-type-header">
                                ${type.toUpperCase()} (${typeClauses.length})
                            </div>
                            ${typeClauses.map(clause => `
                                <div class="clause-item">
                                    <div class="clause-header">
                                        <span class="clause-meta">Page ${clause.page_number}</span>
                                        <div>
                                            <span class="confidence ${clause.confidence > 0.8 ? '' : clause.confidence > 0.6 ? 'medium' : 'low'}">
                                                ${(clause.confidence * 100).toFixed(0)}% Confidence
                                            </span>
                                            ${clause.is_deviation ? '<span class="deviation-badge">⚠️ Deviation</span>' : ''}
                                        </div>
                                    </div>
                                    <div class="clause-text">${clause.text}</div>
                                    ${clause.deviation_notes ? `
                                        <div style="background: #fff3cd; padding: 10px; border-radius: 5px; margin-top: 10px;">
                                            <strong>⚠️ Deviation Notes:</strong> ${clause.deviation_notes}
                                        </div>
                                    ` : ''}
                                    ${clause.obligations.length > 0 ? `
                                        <div class="obligations">
                                            <strong>Obligations:</strong>
                                            ${clause.obligations.map(obl => `
                                                <div class="obligation-item">${obl}</div>
                                            `).join('')}
                                        </div>
                                    ` : ''}
                                </div>
                            `).join('')}
                        </div>
                    `;
                }
            }
            
            clausesTab.innerHTML = html || '<p>No clauses extracted.</p>';
        }
        
        function displayRisks(risks) {
            const risksTab = document.getElementById('risksTab');
            
            if (risks.length === 0) {
                risksTab.innerHTML = '<p>✅ No significant risk areas identified.</p>';
                return;
            }
            
            risksTab.innerHTML = risks.map(risk => `
                <div class="risk-item ${risk.risk_level.toLowerCase()}">
                    <h3 style="color: #dc3545; margin-bottom: 10px;">
                        ${risk.risk_level === 'HIGH' ? '🔴' : '🟡'} ${risk.type.toUpperCase()}
                    </h3>
                    <p><strong>Issue:</strong> ${risk.description}</p>
                    <p><strong>Location:</strong> Page ${risk.page}</p>
                    <p><strong>Recommendation:</strong> ${risk.recommendation}</p>
                </div>
            `).join('');
        }
        
        function showTab(tabName) {
            // Update buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Update content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(tabName + 'Tab').classList.add('active');
        }
    </script>
</body>
</html>
